<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singapore Air Quality & Temperature</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7785;
    --border: #e4e8ee;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --panel: #1a1f26;
      --text: #e6eaf0;
      --muted: #8a94a3;
      --border: #2a313b;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  #status { font-size: 0.78rem; color: var(--muted); flex-basis: 100%; text-align: center; min-height: 1em; order: 3; }
  @media (min-width: 900px) {
    #status { flex-basis: auto; flex: 1; order: 0; }
  }

  .segmented { display: inline-flex; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .segmented button {
    font: inherit; font-size: 0.85rem; padding: 7px 12px; border: none; cursor: pointer;
    background: transparent; color: var(--accent);
  }
  .segmented button.active { background: var(--accent); color: #fff; }

  button.primary {
    font: inherit; font-size: 0.85rem; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; white-space: nowrap;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mapWrap { position: relative; flex: 1 1 60%; min-height: 320px; }
  #map { position: absolute; inset: 0; }

  #legend {
    position: absolute; left: 10px; bottom: 24px; z-index: 500;
    background: var(--panel); color: var(--text); border-radius: 8px;
    padding: 6px 8px; font-size: 0.72rem; box-shadow: 0 1px 4px rgba(0,0,0,.25);
    max-width: 70%;
  }
  #legend .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #legend .swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 2px; }
  #legend .title { font-weight: 600; margin-bottom: 4px; }

  aside {
    flex: 1 1 40%; min-height: 0; overflow-y: auto;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  aside h2 { font-size: 0.95rem; margin: 0 0 8px; }
  #nearby { list-style: none; padding: 0; margin: 0; }
  #nearby li {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; cursor: pointer;
  }
  #nearby li:last-child { border-bottom: none; }
  #nearby .name { font-weight: 500; }
  #nearby .dist { color: var(--muted); font-size: 0.8rem; }
  .chip {
    min-width: 64px; text-align: center; padding: 4px 8px; border-radius: 8px;
    font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); font-size: 0.85rem;
  }
  .empty { color: var(--muted); font-size: 0.9rem; }

  .pin {
    transform: translate(-50%, -50%);
    padding: 3px 6px; border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700;
    white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.8);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .pin.nearby { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bolt {
    transform: translate(-50%, -50%);
    font-size: 22px; line-height: 1;
    filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 3px #facc15);
  }

  @media (min-width: 900px) {
    main { flex-direction: row; }
    #mapWrap { flex: 1 1 auto; min-height: 0; }
    aside { flex: 0 0 340px; border-top: none; border-left: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <h1>SG Air Quality</h1>
  <div class="segmented" role="tablist">
    <button id="modeTemp" data-mode="temp">Temp</button>
    <button id="modePm25" class="active" data-mode="pm25">PM2.5</button>
    <button id="modeRain" data-mode="rain">Rain</button>
  </div>
  <div id="status">Loading…</div>
  <button id="locateBtn" class="primary" disabled>Near me</button>
</header>

<main>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="legend"></div>
  </div>
  <aside>
    <h2 id="nearbyTitle">Nearby stations</h2>
    <ol id="nearby"><li class="empty">Allow location access to see stations near you.</li></ol>
  </aside>
</main>

<script>
// ---------- Config ----------
const DATASETS = {
  temp: {
    url: "https://api-open.data.gov.sg/v2/real-time/api/air-temperature",
    label: "Air temperature",
    unit: "°C",
    decimals: 1,
    color: tempColor,
  },
  pm25: {
    url: "https://api-open.data.gov.sg/v2/real-time/api/pm25",
    label: "PM2.5",
    unit: "µg/m³",
    decimals: 0,
    color: pm25Color,
  },
  rain: {
    url: "https://api-open.data.gov.sg/v2/real-time/api/rainfall",
    label: "Rainfall (5-min)",
    unit: "mm",
    decimals: 1,
    color: rainColor,
  },
};
const SG_CENTER = [1.3521, 103.8198];
const SG_BOUNDS = L.latLngBounds([1.15, 103.6], [1.48, 104.1]);
const NEARBY_COUNT = 10;
const REFRESH_MS = 5 * 60 * 1000;

// ---------- State ----------
const stations = { temp: [], pm25: [], rain: [] };   // each: [{ id, name, lat, lng, value, timestamp }]
let mode = "pm25";
let userLatLng = null;
let userMarker = null;
let pinLayer;
let map;

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
function setStatus(msg) { $("status").textContent = msg; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Temperature (24–34 °C) on a blue → red scale
function tempColor(v) {
  const c = Math.min(Math.max(v, 24), 34);
  const hue = 220 - ((c - 24) / 10) * 220;
  return `hsl(${hue.toFixed(0)}, 75%, 42%)`;
}

// PM2.5 (µg/m³) banded by the common 24-hour breakpoints used in Singapore-style AQ categories
const PM25_BANDS = [
  { max: 12,       color: "#22c55e", label: "Good" },
  { max: 35,       color: "#eab308", label: "Moderate" },
  { max: 55,       color: "#f97316", label: "Unhealthy (sensitive)" },
  { max: 150,      color: "#ef4444", label: "Unhealthy" },
  { max: Infinity, color: "#8b5cf6", label: "Very unhealthy" },
];
function pm25Band(v) { return PM25_BANDS.find(b => v <= b.max); }
function pm25Color(v) { return pm25Band(v).color; }

// Rainfall (mm per 5 minutes) as shades of blue: pale = dry, deep blue = heavy rain
const RAIN_BANDS = [
  { max: 0,        color: "#e0f2fe", label: "None" },
  { max: 0.5,      color: "#7dd3fc", label: "Light" },
  { max: 2,        color: "#38bdf8", label: "Light–moderate" },
  { max: 5,        color: "#0284c7", label: "Moderate" },
  { max: 10,       color: "#1d4ed8", label: "Heavy" },
  { max: Infinity, color: "#1e3a8a", label: "Very heavy" },
];
function rainBand(v) { return RAIN_BANDS.find(b => v <= b.max) || RAIN_BANDS[RAIN_BANDS.length - 1]; }
function rainColor(v) { return rainBand(v).color; }

// Pale backgrounds need dark text for legibility
function textColorFor(key, value) {
  return key === "rain" && value <= 0.5 ? "#0f172a" : "#fff";
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function formatDistance(km) {
  return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
}
function fmtValue(key, v) {
  return `${v.toFixed(DATASETS[key].decimals)}`;
}

// ---------- Data ----------
// Both v2 endpoints share the same shape: data.stations, data.readings[].data[].{stationId, value}
async function fetchDataset(url) {
  const stationMap = new Map();   // id -> { name, lat, lng }
  const latest = new Map();       // id -> { value, timestamp }
  let token = null;

  do {
    const u = new URL(url);
    if (token) u.searchParams.set("paginationToken", token);

    const res = await fetch(u);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.errorMsg || "API returned an error");

    const data = json.data || {};
    for (const s of data.stations || []) {
      if (s.location) {
        stationMap.set(s.id, {
          name: s.name,
          lat: Number(s.location.latitude),
          lng: Number(s.location.longitude),
        });
      }
    }
    for (const r of data.readings || []) {
      for (const item of r.data || []) {
        const prev = latest.get(item.stationId);
        if (!prev || new Date(r.timestamp) > new Date(prev.timestamp)) {
          latest.set(item.stationId, { value: Number(item.value), timestamp: r.timestamp });
        }
      }
    }
    token = data.paginationToken || null;
  } while (token);

  const result = [];
  for (const [id, info] of stationMap) {
    const reading = latest.get(id);
    if (!reading || Number.isNaN(reading.value)) continue;
    result.push({ id, name: info.name, lat: info.lat, lng: info.lng, value: reading.value, timestamp: reading.timestamp });
  }
  return result;
}

// PM2.5 is published per region (north, south, east, west, central), not per station.
// Each region is placed at its labelLocation so it can be drawn and ranked like a station.
async function fetchPm25(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.errorMsg || "API returned an error");

  const data = json.data || {};
  const locations = new Map((data.regionMetadata || []).map(r => [r.name, r.labelLocation]));
  const item = (data.items || [])[0];          // latest item
  const values = item?.readings?.pm25_one_hourly || {};

  const result = [];
  for (const [name, value] of Object.entries(values)) {
    const loc = locations.get(name);
    if (!loc || value == null || Number.isNaN(Number(value))) continue;
    result.push({
      id: name,
      name: `${name.charAt(0).toUpperCase()}${name.slice(1)} region`,
      lat: Number(loc.latitude),
      lng: Number(loc.longitude),
      value: Number(value),
      timestamp: item.timestamp,
    });
  }
  return result;
}

// Lightning feed: data.records[].item.readings[] (empty when no strikes are detected).
// Accepts several common location field layouts since strike records may vary.
const LIGHTNING_URL = "https://api-open.data.gov.sg/v2/real-time/api/weather?api=lightning";
async function fetchLightning(url) {
  const result = [];
  let token = null;

  do {
    const u = new URL(url);
    if (token) u.searchParams.set("paginationToken", token);

    const res = await fetch(u);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.errorMsg || "API returned an error");

    for (const rec of json.data?.records || []) {
      for (const r of rec.item?.readings || []) {
        // Schema: location.latitude / location.longitude are strings; datetime is per reading
        const lat = Number(r.location?.latitude);
        const lng = Number(r.location?.longitude);
        if (!r.location || Number.isNaN(lat) || Number.isNaN(lng)) continue;
        result.push({
          lat,
          lng,
          timestamp: r.datetime ?? rec.datetime,
          type: r.type,        // "C" = cloud to cloud, "G" = cloud to ground
          text: r.text,
        });
      }
    }
    token = json.data?.paginationToken || null;
  } while (token);

  return result;
}

// ---------- Lightning rendering ----------
let lightning = [];
let lightningLayer;

function renderLightning() {
  lightningLayer.clearLayers();
  for (const s of lightning) {
    const icon = L.divIcon({ className: "", html: `<div class="bolt">⚡</div>`, iconSize: null });
    L.marker([s.lat, s.lng], { icon, title: "Lightning detected", zIndexOffset: 1000 })
      .bindPopup(`<strong>Lightning detected</strong>${s.text ? `<br>${escapeHtml(s.text)}` : ""}<br>${new Date(s.timestamp).toLocaleTimeString()}`)
      .addTo(lightningLayer);
  }
}

// ---------- Map rendering ----------
function renderPins() {
  pinLayer.clearLayers();
  const key = mode;
  const cfg = DATASETS[key];
  const nearbyIds = new Set(getNearby().map(s => s.id));

  for (const s of stations[key]) {
    const color = cfg.color(s.value);
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin ${nearbyIds.has(s.id) ? "nearby" : ""}" style="background:${color};color:${textColorFor(key, s.value)}">${fmtValue(key, s.value)}</div>`,
      iconSize: null,
    });
    L.marker([s.lat, s.lng], { icon, title: s.name })
      .bindPopup(`<strong>${escapeHtml(s.name)}</strong><br>${cfg.label}: ${fmtValue(key, s.value)} ${cfg.unit}`)
      .addTo(pinLayer);
  }
}

function renderLegend() {
  const el = $("legend");
  if (mode === "temp") {
    const stops = [24, 26, 28, 30, 32, 34];
    el.innerHTML = `<div class="title">Air temperature (°C)</div><div class="row">` +
      stops.map(t => `<span><span class="swatch" style="background:${tempColor(t)}"></span>${t}</span>`).join("") +
      `</div>`;
  } else if (mode === "rain") {
    el.innerHTML = `<div class="title">Rainfall (mm per 5 min)</div>` +
      RAIN_BANDS.map((b, i) => {
        const lo = i === 0 ? "0" : `${RAIN_BANDS[i - 1].max}`;
        const hi = b.max === Infinity ? "+" : `–${b.max}`;
        const range = i === 0 ? "0" : (b.max === Infinity ? `>${lo}` : `${lo}${hi}`);
        return `<div class="row"><span class="swatch" style="background:${b.color}"></span>${range} ${b.label}</div>`;
      }).join("");
  } else {
    el.innerHTML = `<div class="title">PM2.5 (µg/m³)</div>` +
      PM25_BANDS.map((b, i) => {
        const lo = i === 0 ? 0 : PM25_BANDS[i - 1].max + 1;
        const hi = b.max === Infinity ? "+" : `–${b.max}`;
        return `<div class="row"><span class="swatch" style="background:${b.color}"></span>${lo}${hi} ${b.label}</div>`;
      }).join("");
  }
}

// ---------- Nearby list ----------
function getNearby() {
  if (!userLatLng) return [];
  return stations[mode]
    .map(s => ({ ...s, distKm: haversineKm(userLatLng[0], userLatLng[1], s.lat, s.lng) }))
    .sort((a, b) => a.distKm - b.distKm)
    .slice(0, NEARBY_COUNT);
}

function renderNearby() {
  const list = $("nearby");
  const cfg = DATASETS[mode];
  $("nearbyTitle").textContent = userLatLng ? `Nearest ${cfg.label} stations` : "Nearby stations";

  if (!userLatLng) {
    list.innerHTML = `<li class="empty">Allow location access to see stations near you.</li>`;
    return;
  }
  const nearby = getNearby();
  if (!nearby.length) {
    list.innerHTML = `<li class="empty">No ${cfg.label} data available.</li>`;
    return;
  }
  list.innerHTML = nearby.map(s => {
    const color = cfg.color(s.value);
    const sub = mode === "pm25" ? `${pm25Band(s.value).label} · ` : "";
    return `
    <li data-id="${escapeHtml(s.id)}">
      <div>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="dist">${sub}${formatDistance(s.distKm)} away</div>
      </div>
      <div class="chip" style="background:${color};color:${textColorFor(mode, s.value)}">${fmtValue(mode, s.value)} ${cfg.unit}</div>
    </li>`;
  }).join("");

  list.querySelectorAll("li[data-id]").forEach(li => {
    li.addEventListener("click", () => {
      const s = stations[mode].find(x => x.id === li.dataset.id);
      if (!s) return;
      map.setView([s.lat, s.lng], 16);
      pinLayer.eachLayer(m => { if (m.options.title === s.name) m.openPopup(); });
    });
  });
}

function render() {
  renderLegend();
  renderPins();
  renderNearby();
}

// ---------- Mode switch ----------
function setMode(newMode) {
  mode = newMode;
  document.querySelectorAll(".segmented button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === mode);
  });
  render();
}

// ---------- Geolocation ----------
function locateUser(auto = false) {
  if (!navigator.geolocation) {
    setStatus("Location is not supported by this browser");
    return;
  }
  $("locateBtn").disabled = true;
  setStatus("Getting your location…");

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      if (userMarker) userMarker.remove();
      userMarker = L.circleMarker(userLatLng, {
        radius: 8, color: "#ffffff", weight: 2, fillColor: "#2563eb", fillOpacity: 1,
      }).addTo(map).bindPopup("You are here");

      map.flyTo(userLatLng, 14, { duration: 1 });
      render();
      setStatus(`Updated ${new Date().toLocaleTimeString()}`);
      $("locateBtn").disabled = false;
    },
    (err) => {
      const msg = err.code === 1 ? "Location permission denied" : "Could not get your location";
      setStatus(auto ? "Showing all of Singapore. Tap “Near me” to locate yourself." : msg);
      $("locateBtn").disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

// ---------- Refresh ----------
async function refreshReadings() {
  setStatus("Refreshing readings…");
  const keys = Object.keys(DATASETS);
  const fetchers = {
    temp: () => fetchDataset(DATASETS.temp.url),   // station-based
    pm25: () => fetchPm25(DATASETS.pm25.url),      // region-based
    rain: () => fetchDataset(DATASETS.rain.url),   // station-based, same format as temp
  };
  const results = await Promise.allSettled(keys.map(k => fetchers[k]()));

  const failures = [];
  results.forEach((r, i) => {
    if (r.status === "fulfilled") stations[keys[i]] = r.value;
    else { console.error(r.reason); failures.push(`${DATASETS[keys[i]].label}: ${r.reason.message}`); }
  });

  try {
    lightning = await fetchLightning(LIGHTNING_URL);
  } catch (err) {
    console.error(err);
    lightning = [];
    failures.push(`Lightning: ${err.message}`);
  }
  renderLightning();

  render();
  const counts = keys.map(k => `${stations[k].length} ${DATASETS[k].label}`).join(" · ");
  setStatus(failures.length
    ? `Failed: ${failures.join("; ")}`
    : `${counts} · updated ${new Date().toLocaleTimeString()}`);
  $("locateBtn").disabled = false;
}

// ---------- Init ----------
function init() {
  map = L.map("map", {
    center: SG_CENTER,
    zoom: 11,
    minZoom: 10,
    maxBounds: SG_BOUNDS.pad(0.3),
  });

  // Esri World Street Map: no API key needed. Note the {y}/{x} order in the URL.
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    referrerPolicy: "strict-origin-when-cross-origin",
    attribution: 'Tiles &copy; <a href="https://www.esri.com">Esri</a>, HERE, Garmin, OpenStreetMap contributors',
  }).addTo(map);

  map.fitBounds(SG_BOUNDS);
  pinLayer = L.layerGroup().addTo(map);
  lightningLayer = L.layerGroup().addTo(map);

  document.querySelectorAll(".segmented button").forEach(b => {
    b.addEventListener("click", () => setMode(b.dataset.mode));
  });
  $("locateBtn").addEventListener("click", () => locateUser(false));

  refreshReadings().then(() => locateUser(true));
  setInterval(refreshReadings, REFRESH_MS);
  renderLegend();
}

init();
</script>
</body>
</html>
